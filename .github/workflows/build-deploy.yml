name: "build_deploy_app"

on:
    push:
        branches:
            - master

permissions:
    contents: read

jobs:
    build:
        permissions:
            contents: read
            packages: write
        name: "Build"
        runs-on: davidapps-linux-x64
        steps:
            - name: "Build:checkout"
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "24"
            - name: "Build:download"
              run: yarn
            - name: Login to GitHub Container Registry
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
            - name: "Build:dockerimage"
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                  context: .
                  push: true
                  tags: ghcr.io/davidilie/octoprint-camera-ui:latest
                  cache-from: type=gha,scope=octoprint-camera-ui
                  cache-to: type=gha,mode=max,scope=octoprint-camera-ui
    deploy:
        needs: build
        runs-on: davidapps-linux-x64
        steps:
            - name: Set up kubectl
              uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
            - name: Set Kubernetes Context
              uses: Azure/k8s-set-context@8698eba2499e9012f0d5085f8798077cce4bc526 # v5.0.1
              with:
                  method: kubeconfig
                  kubeconfig: ${{ secrets.KUBE_CONFIG }}
            - name: Restart deployment
              run: kubectl rollout restart deploy octoprint-camera-ui -n internal
