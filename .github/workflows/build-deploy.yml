name: "build_deploy_app"

on:
    push:
        branches:
            - master

permissions:
    contents: read
    packages: write

jobs:
    build:
        name: "Build"
        runs-on: davidapps-linux-x64
        steps:
            - name: "Build:checkout"
              uses: actions/checkout@v7.0.1
            - uses: actions/setup-node@v7.0.0
              with:
                  node-version: "24"
            - name: "Build:download"
              run: yarn
            - name: Login to GitHub Container Registry
              uses: docker/login-action@v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4.2.0
            - name: "Build:dockerimage"
              uses: docker/build-push-action@v7.3.0
              with:
                  context: .
                  push: true
                  tags: ghcr.io/davidilie/octoprint-camera-ui:latest
                  cache-from: type=gha,scope=octoprint-camera-ui
                  cache-to: type=gha,mode=max,scope=octoprint-camera-ui
    deploy:
        needs: build
        runs-on: davidapps-linux-x64
        steps:
            - name: Set up kubectl
              uses: azure/setup-kubectl@v5.1.0
            - name: Set Kubernetes Context
              uses: Azure/k8s-set-context@v5.0.1
              with:
                  method: kubeconfig
                  kubeconfig: ${{ secrets.KUBE_CONFIG }}
            - name: Restart deployment
              run: kubectl rollout restart deploy octoprint-camera-ui -n internal
